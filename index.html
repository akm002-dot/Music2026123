<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- https://www.bootstrapcdn.com/ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    
    <div id="app">
        
            <div v-if="songs.length > 0">
                <br>
                <h2>Songs</h2>
                <br>

        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Year</th>
                    <th>Genre</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="song in songs" :key="song.id">
                    <td>{{ song.title }}</td>
                    <td>{{ song.artist }}</td>
                    <td>{{ song.publishYear }}</td>
                    <td>{{ song.genre }}</td>
                </tr>
            </tbody>
        </table>
        <br>
        <p v-if="message">{{ message }}</p>


    </div>
        <input v-model="newSong.Title" placeholder="New song Title" type="text">
        <input v-model="newSong.Artist" placeholder="New song Artist" type="text">
        <input v-model="newSong.PublishYear" placeholder="New song PublishYear" type="number">
        <input v-model="newSong.Genre" placeholder="New song Genre" type="text">

        <button class="btn btn-primary" @click="AddSong(newSong)">Add song</button>
            
    </div>



    <div>
        <input
            v-model="text"
            placeholder="Write text"
            type="text"
        >

        <select v-model="option">
            <option disabled value="">Select an option</option>
            <option value="Title">Title</option>
            <option value="Artist">Artist</option>
            <option value="PublishYear">PublishYear</option>
            <option value="Genre">Genre</option>

        </select>

        <button
            class="btn btn-primary"
            @click="SearchSong(option, text)"
        >
            Search song
        </button>
    </div>

    


    </div>
    <script src="index.js"></script>
</body>

</html>
